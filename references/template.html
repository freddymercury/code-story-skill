<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Story</title>
<script>
(()=>{const saved=localStorage.getItem('code-story-theme');const theme=saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#fffdfc;--panel:#fff;--ink:#161318;--dim:#6b6470;--rule:#e6e1e7;--acc:#4a2545;--acc-s:#f4eef3;--warn:#7a4a12;--warn-b:#fbf3e5;--f-d:"Fraunces",Georgia,serif;--f-b:"Source Serif 4",Georgia,serif;--f-m:"IBM Plex Mono",ui-monospace,monospace;--m:68ch;color-scheme:light}
:root[data-theme="dark"]{--bg:#14111a;--panel:#1a1620;--ink:#ede7ef;--dim:#9a91a3;--rule:#2e2836;--acc:#d9a7ce;--acc-s:#251e2b;--warn:#e5b575;--warn-b:#2b2113;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.65}code,pre{font-family:var(--f-m)}code{background:var(--acc-s);padding:.08em .3em;border-radius:3px}#app{max-width:1180px;margin:auto;padding:0 clamp(1rem,3vw,2rem);min-height:100vh;display:flex;flex-direction:column}.top{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:1.35rem 0 1rem;border-bottom:1px solid var(--rule)}.top h1{font-family:var(--f-d);font-size:1.15rem;margin:0}.src,.ct{font:12px var(--f-m);color:var(--dim)}.ct{margin-left:auto}.theme{padding:.38rem .65rem;border:1px solid var(--rule);border-radius:999px;background:var(--panel);color:var(--ink);font:11px var(--f-m);cursor:pointer}.theme:hover{border-color:var(--acc)}.wrap{display:grid;grid-template-columns:235px minmax(0,1fr);gap:2.5rem;flex:1;padding:2rem 0}.rail{position:sticky;top:1rem;align-self:start;border-right:1px solid var(--rule);padding-right:1rem}.rail h4{font:600 10px var(--f-m);text-transform:uppercase;letter-spacing:.15em;color:var(--dim)}.rail button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--dim);padding:.45rem 0;font:13px/1.35 var(--f-b);cursor:pointer}.rail button.on{color:var(--acc);font-weight:600}article{display:none}article.on{display:block}.hd{border-bottom:3px solid var(--ink);padding-bottom:1rem;margin-bottom:1.8rem}.eb{font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}h2{font-family:var(--f-d);font-size:clamp(1.9rem,4vw,3rem);line-height:1.05;margin:.55rem 0}.q{max-width:var(--m);color:var(--dim);font-size:1.05rem}.pr{max-width:var(--m)}h3{font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin:2rem 0 .7rem}.dx{border:1px solid var(--rule);background:var(--panel);margin:0 0 1rem}.dh{padding:.55rem .8rem;border-bottom:1px solid var(--rule);font:12px var(--f-m);display:flex;gap:.5rem;flex-wrap:wrap}.dh .tag{margin-left:auto;color:var(--dim)}pre.diff{margin:0;padding:.8rem 1rem;overflow:auto;font-size:12.5px;line-height:1.75;white-space:pre}.note{max-width:var(--m);padding:.7rem 1rem;border-left:3px solid var(--acc);background:var(--acc-s);margin:1rem 0}.note b{font-family:var(--f-m);font-size:12px}.warn{border-left-color:var(--warn);background:var(--warn-b)}figure{margin:1.2rem 0;border:1px solid var(--rule);background:var(--panel)}figure .mermaid{padding:1rem;overflow:auto;text-align:center}figcaption{border-top:1px solid var(--rule);padding:.7rem .9rem;color:var(--dim);font-size:.9rem}.cast{max-width:var(--m)}.nav{display:flex;gap:.7rem;padding:1rem 0 2rem;border-top:1px solid var(--rule)}.nav button{padding:.55rem 1rem;border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}.nav .p{background:var(--acc);color:var(--panel);border-color:var(--acc)}.nav button:disabled{opacity:.35}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}@media(max-width:900px){.wrap{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>
<body><div id="app">
<header class="top"><h1>STORY TITLE</h1><span class="src">SOURCE / CHANGE</span><span class="ct" id="ct"></span><button class="theme" id="theme" type="button" aria-label="Toggle light and dark mode"></button></header>
<div class="wrap"><nav class="rail"><h4>Chapters</h4></nav><main>
<!-- Write one <article> per mechanism here. Each article must contain an h2. -->
<article><div class="hd"><span class="eb">mechanism</span><h2>The question this chapter answers</h2><p class="q">Why a new contributor needs this chapter.</p></div><div class="pr"><p>Explain the mechanism in short, plain sentences.</p></div></article>
</main></div>
<footer class="nav"><button id="prev">← Back</button><button class="p" id="next">Next chapter →</button></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const themeButton=document.getElementById('theme');
const mermaidNodes=[...document.querySelectorAll('.mermaid')];
mermaidNodes.forEach(el=>{el.dataset.source=el.textContent});
function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}
function syncThemeButton(){const dark=currentTheme()==='dark';themeButton.textContent=dark?'☀ Light':'☾ Dark';themeButton.setAttribute('aria-pressed',String(dark))}
async function renderMermaid(){if(!window.mermaid||!mermaidNodes.length)return;mermaidNodes.forEach(el=>{el.removeAttribute('data-processed');el.textContent=el.dataset.source});mermaid.initialize({startOnLoad:false,theme:currentTheme()==='dark'?'dark':'neutral'});await mermaid.run({nodes:mermaidNodes})}
themeButton.onclick=async()=>{const next=currentTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('code-story-theme',next);syncThemeButton();await renderMermaid()};
syncThemeButton();renderMermaid();
const arts=[...document.querySelectorAll('main article')],rail=document.querySelector('.rail'),ct=document.getElementById('ct'),prev=document.getElementById('prev'),next=document.getElementById('next');let at=0;
arts.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.querySelector('h2').textContent;b.onclick=()=>go(i);rail.append(b)});
function go(i){at=Math.max(0,Math.min(arts.length-1,i));arts.forEach((a,j)=>a.classList.toggle('on',j===at));[...rail.querySelectorAll('button')].forEach((b,j)=>b.classList.toggle('on',j===at));ct.textContent=`Chapter ${at+1} of ${arts.length}`;prev.disabled=at===0;next.disabled=at===arts.length-1;scrollTo({top:0,behavior:'smooth'})}prev.onclick=()=>go(at-1);next.onclick=()=>go(at+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(at+1);if(e.key==='ArrowLeft')go(at-1)});go(0);
</script></body></html>
